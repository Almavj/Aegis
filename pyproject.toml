[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Autonomous offensive security framework"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "textual>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["aegis*"]
